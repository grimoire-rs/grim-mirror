name: Build grim
description: Build the grim binary the acceptance suites run against, from a pinned grimoire commit, and upload it as an artifact.

inputs:
  commit:
    description: Full commit SHA of grimoire-rs/grimoire to build
    required: true
  artifact:
    description: Name of the uploaded artifact
    required: true

runs:
  using: composite
  steps:
    - name: Checkout grimoire
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: grimoire-rs/grimoire
        ref: ${{ inputs.commit }}
        path: grimoire-src
        # grim's build needs external/docker_credential and external/rust-oci-client.
        submodules: recursive
        persist-credentials: false
    - name: Restore grim build
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: grimoire-src/target/release/grim
        key: grim-${{ runner.os }}-${{ runner.arch }}-${{ inputs.commit }}
    - name: Install Rust Toolchain
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      # Toolchain of this repository; grim's own rust-toolchain.toml is
      # honoured by rustup inside grimoire-src and installs on demand.
      uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        cache: false
    - name: Build grim
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      working-directory: grimoire-src
      run: cargo build --release --locked
    - name: Upload grim Binary
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: grimoire-src/target/release/grim
        compression-level: 0
        # Rerunning one failed shard downloads this again, possibly days later.
        retention-days: 3
