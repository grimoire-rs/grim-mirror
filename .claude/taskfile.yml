# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  REPORTS_DIR: '{{if .REPORTS_ROOT}}{{.REPORTS_ROOT}}/claude{{else}}{{.TASKFILE_DIR}}/reports{{end}}'

x-shared:
  claude-sources: &claude-sources
    - '**/*'
    - '../CLAUDE.md'
    - '../AGENTS.md'
    - '../taskfile.yml'
    - '../taskfiles/**/*.yml'
    - '../scaffold-manifest.toml'
    - '../tools/*.py'
    - '../.github/workflows/**'
    - '../.agents/plans/*.md'
    - exclude: '**/__pycache__/**'
    - exclude: '**/.venv/**'
    - exclude: '**/.state/**'
    - exclude: '**/.locks/**'

tasks:
  verify:
    desc: Validate the .claude/ subsystem (structural tests + link check)
    cmds:
      - task: tests
      - task: lint:links

  statusline:install:
    desc: Install the enhanced cross-platform Claude Code statusline to ~/.claude/
    platforms: [linux, darwin]
    cmds:
      - bash scripts/statusline-install.sh

  tests:
    desc: Validate AI configuration structural integrity (test_ai_config.py, test_hooks.py), the scaffold-manifest checker and the manifest itself
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - mkdir -p {{.REPORTS_DIR}}
      - >
        uv run --directory tests pytest test_ai_config.py test_hooks.py test_scaffold_manifest.py -v
        --junitxml={{.REPORTS_DIR}}/tests.junit.xml
      - uv run --directory tests python ../../tools/scaffold_manifest.py check
    sources: *claude-sources
    generates:
      - '{{.REPORTS_DIR}}/tests.junit.xml'

  fix:canonical-block:
    desc: Re-sync canonical Review-Fix Loop block from workflow-bugfix.md to workflow-refactor.md
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 scripts/sync-canonical-blocks.py

  lint:links:
    desc: Check markdown cross-references in .claude/, CLAUDE.md, and AGENTS.md (offline; skipped if lychee absent)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - mkdir -p {{.REPORTS_DIR}}
      - |
        if ! command -v lychee >/dev/null 2>&1; then
          echo "lychee not installed — skipping link check (install: https://github.com/lycheeverse/lychee)"
          exit 0
        fi
        # Installed bundle content is not authored here (the next `grim install`
        # reverts a local edit, so fix it upstream). grimoire.lock names every
        # installed skill and rule; skip exactly those. Newer bundles nest
        # `repository:` under `metadata:` or omit it, so frontmatter is no marker.
        EXCL=$(awk -F'"' '/^\[\[/{k=$0} /^name = /{ if (k=="[[skill]]") print "--exclude-path skills/" $2; else if (k=="[[rule]]") print "--exclude-path rules/" $2 ".md --exclude-path rules/" $2 }' ../grimoire.lock)
        # shellcheck disable=SC2086
        lychee --offline --no-progress --include-verbatim \
          --exclude-path templates/artifacts \
          --exclude-path tests/.venv \
          --exclude-path worktrees \
          $EXCL \
          --format json --output {{.REPORTS_DIR}}/lint-links.json \
          ../CLAUDE.md ../AGENTS.md .
    sources: *claude-sources
    generates:
      - '{{.REPORTS_DIR}}/lint-links.json'
